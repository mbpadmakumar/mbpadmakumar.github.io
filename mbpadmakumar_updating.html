<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBPADMAKUMAR — Website Updating</title>
<style>
:root{--bg:#0b0b0b;--fg:#f4f2ed;--muted:#a8a59e;--line:rgba(244,242,237,.16);--accent:#c8a96b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% 28%,rgba(200,169,107,.10),transparent 26%),radial-gradient(circle at 20% 80%,rgba(255,255,255,.04),transparent 24%),var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center}
.page{width:min(1100px,90vw);min-height:78vh;display:flex;flex-direction:column;justify-content:space-between;padding:40px 0}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}
.brand{letter-spacing:.18em;font-size:14px;font-weight:600}.mark{width:38px;height:38px;border:1px solid var(--accent);display:grid;place-items:center;border-radius:50%;color:var(--accent);font-size:13px}
main{max-width:820px;padding:40px 0}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.22em;font-size:12px;margin-bottom:28px}
h1{margin:0;font-size:clamp(48px,8vw,96px);line-height:.95;letter-spacing:-.045em;font-weight:500}
.sub{margin-top:28px;color:var(--muted);font-size:clamp(18px,2vw,23px);line-height:1.55;max-width:650px}
.rule{width:64px;height:1px;background:var(--accent);margin-top:34px}
footer{border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.06em}
.status{color:var(--fg)}
@media(max-width:640px){.page{min-height:86vh;padding:26px 0}main{padding:30px 0}footer{flex-direction:column}}
</style>
</head>
<body>
<div class="page">
<header><div class="brand">MBPADMAKUMAR</div><div class="mark">MBP</div></header>
<main>
<div class="eyebrow">Official Website</div>
<h1>Website<br>Updating.</h1>
<p class="sub">A new creative space is taking shape — films, writing, sound, filmmaking and more.</p>
<div class="rule"></div>
</main>
<footer><div class="status">COMING SOON</div><div>mbpadmakumar.com</div></footer>
</div>
</body>
</html>
